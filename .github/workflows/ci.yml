name: ACE Canteen CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///./backend/ci_canteen.db
          SECRET_KEY: ci-only-secret-key-change-before-deployment
          ENVIRONMENT: development
        run: python -m pytest backend/tests -q
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/js/app.js
          node --check frontend/sw.js
          node --check e2e/canteen.spec.js
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  browser:
    name: Chromium browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: pip install -r backend/requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///./backend/e2e_canteen.db
          SECRET_KEY: ci-only-secret-key-change-before-deployment
          ENVIRONMENT: development
          AUTO_CREATE_TABLES: 'true'
          SEED_DEMO_DATA: 'true'
        run: npm run test:e2e
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
