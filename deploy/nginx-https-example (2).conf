# Example reverse-proxy server block. Configure real certificate paths and domain.
# The app should not be exposed directly to the public internet.
server {
    listen 443 ssl http2;
    server_name canteen.example.edu;

    ssl_certificate     /etc/letsencrypt/live/canteen.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canteen.example.edu/privkey.pem;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 80;
    server_name canteen.example.edu;
    return 301 https://$host$request_uri;
}
