services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ace_canteen}
      POSTGRES_USER: ${POSTGRES_USER:-ace_canteen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ace_canteen} -d ${POSTGRES_DB:-ace_canteen}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [canteen_internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [canteen_internal]

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ace_canteen}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ace_canteen}
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      SEED_DEMO_DATA: "false"
    command: ["python", "-m", "alembic", "-c", "/app/backend/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks: [canteen_internal]
    profiles: [ops]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ace_canteen}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ace_canteen}
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      SEED_DEMO_DATA: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [canteen_internal]

volumes:
  postgres_data:

networks:
  canteen_internal:
    driver: bridge
